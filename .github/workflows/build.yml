name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner (M1)

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify bundle
        run: |
          test -f build/PoofOnClose.app/Contents/MacOS/PoofOnClose
          test -f build/PoofOnClose.app/Contents/Info.plist
          echo "✅ Bundle looks good"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PoofOnClose-${{ github.sha }}
          path: build/PoofOnClose.app
          retention-days: 7
